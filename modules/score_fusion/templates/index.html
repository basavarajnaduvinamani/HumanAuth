<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>HumanAuth (Human Authentication)</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-light">
  <div class="container py-5 text-center">
    <h1 class="display-4 fw-bold">HumanAuth</h1>
    <p class="text-muted fs-5">(Human Authentication)</p>

    <form action="/submit" method="POST" class="mt-5">
      <div class="row g-4">
        <!-- Liveness -->
        <div class="col-md-4">
          <div class="card shadow-sm h-100">
            <div class="card-body">
              <h5 class="card-title">Liveness Detection</h5>
              <select name="liveness_result" class="form-select mb-3" required>
                <option value="" disabled selected>Select Result</option>
                <option value="Real">Real</option>
                <option value="Spoof">Spoof</option>
              </select>
              <input type="number" name="liveness_score" step="0.01" min="0" max="1" class="form-control" placeholder="Score (0 to 1)" required>
              <button type="button" class="btn btn-outline-primary mt-3" disabled>Verify</button>
            </div>
          </div>
        </div>

        <!-- Biometric -->
        <div class="col-md-4">
          <div class="card shadow-sm h-100">
            <div class="card-body">
              <h5 class="card-title">Biometric Authentication</h5>
              <select name="biometric_result" class="form-select mb-3" required>
                <option value="" disabled selected>Select Result</option>
                <option value="Passed">Passed</option>
                <option value="Failed">Failed</option>
              </select>
              <input type="number" name="biometric_score" step="0.01" min="0" max="1" class="form-control" placeholder="Score (0 to 1)" required>
              <button type="button" class="btn btn-outline-primary mt-3" disabled>Verify</button>
            </div>
          </div>
        </div>

        <!-- Document -->
        <div class="col-md-4">
          <div class="card shadow-sm h-100">
            <div class="card-body">
              <h5 class="card-title">Document Verification</h5>
              <select name="document_result" class="form-select mb-3" required>
                <option value="" disabled selected>Select Result</option>
                <option value="Genuine">Genuine</option>
                <option value="Forged">Forged</option>
              </select>
              <input type="number" name="document_score" step="0.01" min="0" max="1" class="form-control" placeholder="Score (0 to 1)" required>
              <button type="button" class="btn btn-outline-primary mt-3" disabled>Verify</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Final Submit -->
      <div class="mt-5">
        <button type="submit" class="btn btn-success btn-lg px-5">Calculate Final Score</button>
      </div>
    </form>

    {% if result %}
      <div class="alert mt-4 fs-4 fw-semibold {{ 'alert-success' if passed else 'alert-danger' }}">
        {{ result }}
      </div>
    {% endif %}
  </div>
</body>
</html>
